<style>
  /* Web App nhân viên – nền kem ấm, thẻ bo lớn, điểm nhấn xanh chanh, chữ số mảnh */
  :root{
    --m-bg:#EFEFE7; --m-card:#FAFAF5; --m-ink:#1D1D1B; --m-muted:#83837A; --m-line:#E2E2D8; --m-soft:#E6E6DC; --m-olive:#DCDCC9;
    --m-lime:#C6F03A; --m-blue:#93D2F2; --m-purple:#C3A8F6; --m-lilac:#A98BEF; --m-pink:#F3B6E2; --m-orange:#F39A6A; --m-red:#EE8E8E; --m-grey:#9A9D8E;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--m-bg:#121310;--m-card:#1B1C18;--m-ink:#EDEDE6;--m-muted:#9C9C92;--m-line:#2C2D27;--m-soft:#26271F;--m-olive:#34352B;--m-grey:#6E7064}}
  :root[data-theme="dark"]{--m-bg:#121310;--m-card:#1B1C18;--m-ink:#EDEDE6;--m-muted:#9C9C92;--m-line:#2C2D27;--m-soft:#26271F;--m-olive:#34352B;--m-grey:#6E7064}
  body.portal{background:var(--m-bg);color:var(--m-ink)}
  .m-wrap{max-width:460px;margin:0 auto;min-height:100vh;position:relative}
  .m-main{padding:calc(14px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 120px max(18px,env(safe-area-inset-left,0px))}
  .m-head{display:flex;align-items:center;gap:10px;margin:6px 0 18px}
  .m-head h1{font-size:23px;font-weight:500;letter-spacing:.02em;margin:0}
  .grow{flex:1}
  .m-ic{width:50px;height:50px;border-radius:50%;border:1px solid var(--m-line);background:var(--m-card);display:grid;place-items:center;cursor:pointer;color:var(--m-ink);position:relative;flex-shrink:0;font-size:18px}
  .m-ic svg{width:21px;height:21px}.m-ic.sm{width:38px;height:38px}.m-ic.sm svg{width:17px;height:17px}
  .m-ic.ok{background:var(--m-lime);border-color:var(--m-lime);color:#1D1D1B}.m-ic.bad{color:#c0392b}
  .m-dot{position:absolute;top:11px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--m-orange)}
  .m-av{border:0;background:none;padding:0;cursor:pointer;border-radius:50%}.m-av .avatar{border:2px solid var(--m-card)}
  .m-big{font-size:30px;font-weight:300;line-height:1.25;margin:4px 4px 18px;letter-spacing:-.01em}
  .m-card{background:var(--m-card);border-radius:30px;padding:20px;margin-bottom:14px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .m-center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
  .m-row{display:flex;align-items:center;gap:8px}
  .m-label{font-size:12.5px;letter-spacing:.06em;color:var(--m-ink);font-weight:500}
  .m-muted{color:var(--m-muted);font-size:13px;line-height:1.45}
  .m-num{font-size:34px;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .m-hero{font-size:64px;font-weight:300;letter-spacing:-.04em;line-height:1;margin:10px 0 6px;font-variant-numeric:tabular-nums}
  .m-hero small{font-size:18px;margin-left:4px;letter-spacing:0}
  .m-hero.lilac{color:var(--m-lilac)}
  .m-pill{display:inline-flex;align-items:center;padding:5px 12px;border-radius:999px;background:var(--m-soft);font-size:12.5px;white-space:nowrap}
  .m-pill.ok{background:var(--m-lime);color:#1D1D1B}.m-pill.warn{background:#FCE1CF;color:#8A3B12}.m-pill.bad{background:#F8D3D3;color:#8E1E1E}
  .m-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--m-line);background:var(--m-card);color:var(--m-ink);border-radius:999px;padding:13px 22px;font-weight:500;cursor:pointer;font-size:14.5px}
  .m-btn svg{width:18px;height:18px}.m-btn.lime{background:var(--m-lime);border-color:var(--m-lime);color:#1D1D1B}.m-btn.big{width:100%;padding:16px;margin-top:8px}.m-btn.ghost{background:none}
  .m-link{background:none;border:0;color:var(--m-ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13.5px;padding:8px 0;font-weight:500}
  .m-pills{display:flex;gap:8px;overflow-x:auto;margin:0 0 14px;padding-bottom:2px}
  .m-pills button{border:1px solid var(--m-line);background:var(--m-card);color:var(--m-ink);border-radius:999px;padding:12px 18px;white-space:nowrap;cursor:pointer;font-size:14px}
  .m-pills button.on{background:var(--m-olive);border-color:var(--m-olive)}
  .m-ico-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 6px;margin:4px 0 18px}
  .m-ico-tabs.rt{grid-template-columns:repeat(3,minmax(0,1fr));margin:12px 0 6px}
  .m-ico-tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;color:var(--m-ink);padding:0;font:inherit;min-width:0}
  .m-ico-tabs .ic{width:56px;height:56px;border-radius:50%;background:var(--m-card);border:1px solid var(--m-line);display:grid;place-items:center;position:relative;transition:background .15s}
  .m-ico-tabs.rt .ic{background:var(--m-bg)}
  .m-ico-tabs .ic svg{width:22px;height:22px}
  .m-ico-tabs .ic .m-badge{top:-2px;right:-2px}
  .m-ico-tabs small{font-size:12px;line-height:1.25;text-align:center;color:var(--m-muted);max-width:100%;overflow-wrap:anywhere}
  .m-ico-tabs button.on .ic{background:var(--m-lime);border-color:var(--m-lime);color:#1D1D1B}
  .m-ico-tabs button.on small{color:var(--m-ink);font-weight:600}
  .m-chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .m-chips button{border:1px solid var(--m-line);background:var(--m-bg);color:var(--m-ink);border-radius:999px;padding:9px 14px;cursor:pointer;font-size:13.5px}
  .m-chips button.on{background:var(--m-lime);border-color:var(--m-lime);color:#1D1D1B;font-weight:500}
  .m-fl{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--m-muted);margin:10px 0;text-align:left;width:100%}
  .m-fl small{font-size:12px}
  .m-in{border:1px solid var(--m-line);background:var(--m-bg);color:var(--m-ink);border-radius:16px;padding:13px 14px;font:inherit;font-size:15px;outline:0;width:100%}
  .m-in:focus{border-color:var(--m-ink)}.m-in.sm{width:auto;padding:9px 14px;border-radius:999px;font-size:14px}
  .m-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .m-2>*{min-width:0}
  .m-in{box-sizing:border-box;min-width:0;max-width:100%;font-size:16px}
  .m-in[type=date],.m-in[type=time],.m-in[type=month]{-webkit-appearance:none;appearance:none;display:block;min-height:50px;text-align:left;padding-left:12px;padding-right:12px}
  .m-in::-webkit-date-and-time-value{text-align:left;margin:0}
  html,body.portal{overflow-x:hidden;-webkit-text-size-adjust:100%}
  .m-bars{display:grid;gap:10px;margin:6px 0 8px}
  .m-bar{background:var(--m-soft);border-radius:999px;height:46px;position:relative}
  .m-bar-fill{height:100%;border-radius:999px;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 18px;font-size:13.5px;background:repeating-linear-gradient(135deg,var(--m-olive) 0 6px,var(--m-soft) 6px 12px)}
  .m-bar:nth-child(2n) .m-bar-fill{background:var(--m-olive)}
  .m-bar-fill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:8px}
  .m-chip{font-style:normal;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:500;color:#1D1D1B;white-space:nowrap}
  .m-chip.lime{background:var(--m-lime)}.m-chip.blue{background:var(--m-blue)}.m-chip.purple{background:var(--m-purple)}.m-chip.pink{background:var(--m-pink)}
  .m-waffle{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .m-waffle span{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:11px;color:rgba(0,0,0,.55)}
  .m-waffle .w-h{aspect-ratio:auto;font-size:10.5px;color:var(--m-muted);padding-bottom:2px}
  .w.x{background:var(--m-grey)}.w.m{background:var(--m-orange)}.w.o{background:var(--m-lime)}.w.p{background:var(--m-purple)}.w.k{background:var(--m-red)}.w.cn{background:var(--m-soft);color:var(--m-muted)}.w.f{background:var(--m-bg);color:var(--m-muted);border:1px dashed var(--m-line)}
  .m-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--m-muted)}
  .m-legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
  .m-legend .x::before{background:var(--m-grey)}.m-legend .m::before{background:var(--m-orange)}.m-legend .o::before{background:var(--m-lime)}.m-legend .p::before{background:var(--m-purple)}.m-legend .k::before{background:var(--m-red)}
  .m-review{display:flex;align-items:stretch;gap:10px;width:100%;background:var(--m-card);border:0;border-radius:26px;padding:10px;margin-bottom:12px;text-align:left;cursor:pointer;color:var(--m-ink)}
  .m-review-tag{display:grid;place-items:center;min-width:74px;color:#5B8C00;font-weight:500;font-size:13.5px}
  .m-review-body{flex:1;background:var(--m-bg);border-radius:20px;padding:12px 16px;display:flex;flex-direction:column;gap:3px}
  .m-review-body small{color:var(--m-muted);font-size:12px}.m-review-body b{font-weight:500;font-size:15px;line-height:1.35}
  .m-li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--m-line)}
  .m-li:last-of-type{border-bottom:0}
  .m-li .grow{min-width:0;display:flex;flex-direction:column;gap:2px}.m-li b{font-weight:500}.m-li small{color:var(--m-muted);font-size:12.5px}
  .m-li .m-sub{font-weight:400;font-size:13.5px}
  .m-th{width:44px;height:44px;border-radius:14px;object-fit:cover;background:var(--m-soft);display:grid;place-items:center;flex-shrink:0}
  .m-th svg{width:20px;height:20px}
  .m-act{display:flex;gap:6px}
  .m-kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:14px 0;font-size:14px}
  .m-kv span{color:var(--m-muted)}.m-kv b{text-align:right;font-weight:500}
  .m-tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .m-tiles button{background:var(--m-card);border:0;border-radius:26px;padding:18px;display:flex;flex-direction:column;align-items:flex-start;gap:28px;cursor:pointer;color:var(--m-ink);position:relative;text-align:left}
  .m-tiles b{font-weight:500;font-size:15px}
  .m-badge{position:absolute;top:8px;right:8px;background:var(--m-orange);color:#fff;font-style:normal;font-size:10.5px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
  .m-clock{font-size:72px;font-weight:300;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
  .m-cam{width:220px;height:220px;border-radius:50%;overflow:hidden;background:var(--m-soft);position:relative;border:6px solid var(--m-lime);display:grid;place-items:center}
  .m-cam video,.m-cam img{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.m-cam img{transform:none}
  .m-cam-msg{position:absolute;inset:0;display:grid;place-items:center;padding:24px;font-size:12.5px;color:var(--m-muted);text-align:center}
  .m-loc{display:flex;align-items:center;gap:8px;background:var(--m-soft);border-radius:999px;padding:10px 16px;font-size:13.5px;max-width:100%}
  .m-loc svg{width:18px;height:18px;flex-shrink:0}.m-loc.ok{background:var(--m-lime);color:#1D1D1B}.m-loc.bad{background:#FCE1CF;color:#8A3B12}
  .m-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(430px,calc(100% - 28px));background:var(--m-card);border-radius:999px;padding:8px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 30px rgba(30,30,20,.12);z-index:30}
  .m-nav button{width:56px;height:56px;border-radius:50%;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--m-ink);position:relative;transition:.15s}
  .m-nav button svg{width:23px;height:23px}
  .m-nav button.on{background:var(--m-lime);width:66px;height:66px;color:#1D1D1B}
  .m-nav .m-badge{top:4px;right:4px}
  .m-login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--m-bg)}
  .m-login-box{width:400px;max-width:100%;background:var(--m-card);border-radius:32px;padding:28px}
  .m-logo{display:flex;justify-content:center;margin-bottom:10px}
  .m-login .m-big{text-align:center;margin:6px 0}.m-login .m-muted{text-align:center;margin:0 0 10px}
  .p-slip{padding:10px}.p-slip td{white-space:normal}.p-slip td:last-child{white-space:nowrap}
  .portal .avatar{background:var(--m-olive);color:var(--m-ink)}
  .portal .toast{bottom:110px}
  @media (prefers-reduced-motion:reduce){.m-nav button{transition:none}}
  @media print{.m-nav,.m-head{display:none!important}}
</style>
</head>
